<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style></head><body>
<title>Imast демо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, five tabs at the bottom, night-sky palette with gold. */
:root{
  --bg:#0E1526; --surface:#162038; --surface2:#1C2947; --line:#2A3756;
  --fg:#EDE8DC; --muted:#9AA5BC; --gold:#D4AE5A; --gold-ink:#F4E4B0; --on-gold:#14203A;
  --ok:#7FB58A; --warn:#E39A8F; --cover:#1B2745; --cover-line:#2A3756;
  --display:'Cormorant Garamond',Georgia,serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F1E8; --surface:#FBF8F1; --surface2:#EFE6D2; --line:#DDD3BE;
    --fg:#1B1F2A; --muted:#5B6173; --gold:#8A6417; --gold-ink:#6B4C10; --on-gold:#FBF8F1;
    --ok:#3F7A4D; --warn:#A8483C; --cover:#E4DAC3; --cover-line:#D3C8AE; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F5F1E8; --surface:#FBF8F1; --surface2:#EFE6D2; --line:#DDD3BE;
  --fg:#1B1F2A; --muted:#5B6173; --gold:#8A6417; --gold-ink:#6B4C10; --on-gold:#FBF8F1;
  --ok:#3F7A4D; --warn:#A8483C; --cover:#E4DAC3; --cover-line:#D3C8AE; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;color:var(--gold-ink);line-height:1}
.brand{flex:none;display:flex;align-items:center;gap:10px}.brand svg{flex:none;width:38px;height:34px;fill:var(--gold)}textarea{resize:vertical;min-height:76px;line-height:1.4}.brand small{display:block;white-space:nowrap;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chips{display:flex;align-items:center;gap:8px}
.chip{white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:transparent}
.chip.gold{color:var(--gold-ink);border-color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
main{display:flex;flex-direction:column;gap:16px;padding-top:8px}
h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;min-height:46px}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.quote{font-family:var(--display);font-style:italic;font-weight:500;font-size:29px;line-height:1.28;color:var(--fg);text-wrap:balance}
.author{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-ink)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px}
.qmark{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold-ink);background:transparent;font-weight:700;font-size:15px;display:grid;place-items:center;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg.s3 button{font-size:13.5px}
@media (max-width:360px){.seg.s3{gap:2px;padding:3px}.seg.s3 button{font-size:11.5px;padding:10px 1px}}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--gold-ink)}
.stepper{display:flex;justify-content:space-between;align-items:center}
.step{font-size:14px;font-weight:600;color:var(--gold-ink)}
.q-title{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.2}
.field{position:relative}
.field input[type=text],.field textarea,.form input[type=text],.form input[type=time],.form input[type=date],.form textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:17px}
.counter{position:absolute;right:12px;bottom:-22px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;gap:10px;font-size:15px}
.ans b{flex:none;width:20px;color:var(--gold-ink);font-weight:600}
.mentor{border-left:3px solid var(--gold);padding-left:14px;display:flex;flex-direction:column;gap:6px}
.mentor .who{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold-ink)}
.mentor.safe{border-left-color:var(--warn)}
.mosaic{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line);background:var(--cover)}
.mosaic svg.portrait{position:absolute;inset:0;width:100%;height:100%;display:block}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(9,1fr)}
.tile{background:var(--cover);outline:1px solid var(--cover-line);outline-offset:-0.5px;transition:opacity .6s}
.tile.open{opacity:0;pointer-events:none}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.caption{font-family:var(--display);font-style:italic;font-size:22px;color:var(--gold-ink)}
.habit{display:flex;flex-direction:column;gap:10px}
.habit-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.habit-name{font-weight:600;font-size:18px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.day.on{color:var(--gold-ink);border-color:var(--gold)}
.chipbtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.chipbtn[aria-pressed="true"]{color:var(--on-gold);background:var(--gold);border-color:var(--gold)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:12px;font-weight:600;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:0}
.cal .d.today{border-color:var(--gold);color:var(--fg)}
.cal .d.empty{border:0}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.dots i.leaf{border-radius:2px 7px 2px 7px;background:var(--ok)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:6px}
.legend i.leaf{border-radius:2px 9px 2px 9px;background:var(--ok)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.totals div{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.totals b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.totals span{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--gold-ink)}
.tab[aria-current="page"] svg{stroke:var(--gold)}
.overlay{position:fixed;inset:0;background:rgba(5,8,16,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:28px}
.tree-wrap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px}
.tree-wrap svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
/* заставка */
#splash{position:fixed;inset:0;z-index:50;background:#0E1526;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));text-align:center;transition:opacity .5s}
#splash svg{width:120px;height:108px;fill:#D4AE5A}
#splash .sp-name{font-family:var(--display);font-weight:700;font-size:44px;color:#F4E4B0;line-height:1}
#splash .sp-phrase{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.35;color:#EDE8DC;max-width:420px;opacity:0;transition:opacity .6s}
#splash.show-phrase .sp-phrase{opacity:1}
#splash.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){#splash,#splash .sp-phrase{transition:none}}
/* код входа */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}
.pin-dots i.on{background:var(--gold)}
.pin-msg{min-height:20px;text-align:center;font-size:14px;color:var(--warn)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.keypad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.keypad button.kp-ghost{background:transparent;font-size:15px}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
/* баннер копии */
.banner{display:flex;flex-direction:column;gap:10px;border:1px solid var(--gold);border-radius:14px;padding:14px 16px;background:var(--surface)}
/* обучение */
.blk{display:flex;align-items:center;justify-content:space-between;gap:12px}
.blk .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.blk .bn{font-weight:600;font-size:17px}
.state{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{color:var(--on-gold);background:var(--gold);border-color:var(--gold)}
.lsec{display:flex;flex-direction:column;gap:6px}
.lsec p{font-size:16px;line-height:1.55}
.term{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.term b{font-family:var(--display);font-size:20px;color:var(--gold-ink);font-weight:600}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px;min-height:48px}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.opt[disabled]{cursor:default}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--warn)}
/* задачи и доска */
.tasktabs{display:flex;gap:8px;align-items:center}
.tasktabs .scroll{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
.plus{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font-size:26px;line-height:1;display:grid;place-items:center;padding:0}
.board-wrap{position:relative;height:62vh;min-height:360px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#0B1120;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.board{position:relative;transform-origin:0 0}
.board svg.threads{position:absolute;inset:0;overflow:visible}
.bc{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-radius:6px;background:#EDE3CC;color:#1B1F2A;box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:13px;line-height:1.25;text-align:left;border:1px solid #CDBF9F;overflow:hidden}
.bc .ttl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bc .bd{font-size:11px;color:#6B5A3A;flex:none}
.bc.center{background:#F4E4B0;border:2px solid #D4AE5A;font-family:var(--display);font-size:18px;font-weight:700;text-align:center;align-items:center}
.bc.block{background:#E4D6B4;font-weight:700}
.bc.done{border:2px solid #D4AE5A}
.bc.done .ttl::before{content:'✓ ';color:#8A6417;font-weight:700}
.bc.locked{opacity:.45}
.bc.due{box-shadow:0 0 0 2px #E39A8F,0 2px 8px rgba(0,0,0,.45)}
.pin-tack{position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#D4AE5A;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.zoom{position:sticky;left:calc(100% - 52px);top:10px;width:40px;display:flex;flex-direction:column;gap:6px;z-index:3;float:right;margin:10px 10px -96px 0}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.steprow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.steprow:first-child{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gold);background:transparent;color:var(--on-gold);font-weight:700;padding:0;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--gold)}
.chk[disabled]{opacity:.4;cursor:not-allowed}
.edblock{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px}
.edstep{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.edstep .when{display:flex;gap:6px;grid-column:1 / -1}
.edstep input,.edblock input,.form select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;min-width:0}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:10px;width:40px;height:40px;color:var(--muted);font-size:18px;padding:0}
.entry-item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.entry-item:first-of-type{border-top:0}
button.blk[disabled]{opacity:.5;cursor:not-allowed}
button.card{font:inherit;color:inherit;background:var(--surface)}
.fmtname{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold-ink)}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="195 205 675 605" aria-hidden="true"><rect x="205" y="215" width="190" height="36" rx="3"/><path d="M216 251H384L360 286H240Z"/><rect x="250" y="286" width="100" height="440"/><rect x="226" y="726" width="148" height="39" rx="12"/><rect x="205" y="765" width="190" height="35" rx="2"/><path d="M250 470A170 170 0 0 1 590 470H490A70 70 0 0 0 350 470Z"/><path d="M490 470A170 170 0 0 1 830 470H730A70 70 0 0 0 590 470Z"/><rect x="474" y="470" width="132" height="26" rx="3"/><rect x="490" y="496" width="100" height="240"/><rect x="470" y="732" width="140" height="35" rx="12"/><rect x="460" y="767" width="160" height="33" rx="2"/><rect x="714" y="470" width="132" height="26" rx="3"/><rect x="730" y="496" width="100" height="240"/><rect x="710" y="732" width="140" height="35" rx="12"/><rect x="700" y="767" width="160" height="33" rx="2"/></svg><span style="display:block">Imast<small>CRM для жизни</small></span></div>

      <span class="chip" id="chipSample" hidden>Пример</span>
      <button class="icon-btn" id="btnSettings" aria-label="Данные и настройки демо">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Разделы">
  <div class="inner" id="tabs"></div>

<div id="modal"></div>

<script>
(function(){

var KEY='imast-demo-v1', mem=null;
function blank(){return {welcome:true,days:{},habits:[],timeMode:'auto',perm:null,sample:false,learn:{}};}
function load(){
  try{var s=localStorage.getItem(KEY); if(s) return Object.assign(blank(),JSON.parse(s));}catch(e){}

}

/* старая «Запись дня» (одна в день) переезжает в список записей */
function migrate(){
  for(var k in S.days){var r=S.days[k];if(!r)continue;
    if(r.entry&&!r.entries)r.entries=[{f:'day',v:{s:r.entry.s||'',a:r.entry.a||'',c:r.entry.c||''},t:0}];

/* блокировка при возврате в приложение: ext — мы сами открыли другое окно (файл, календарь, отпечаток) */
var ext=false, pausedAt=0, ignoreResumeUntil=0;
function goingOut(){ext=true;}
function onPause(){pausedAt=Date.now();}
function onResume(){
  if(ext){ext=false;pausedAt=0;return;}
  var away=pausedAt?Date.now()-pausedAt:0;pausedAt=0;
  if(Date.now()<ignoreResumeUntil)return;

window.ImastNativeCallback=function(t,v){if(t==='launch'){openSess(v);return;}if(t==='resume'){widgetSync();onResume();return;}if(t==='pause'){onPause();return;}var f=nCbs[t];if(f){delete nCbs[t];f(v);}};
if(!NATIVE)document.addEventListener('visibilitychange',function(){if(document.hidden)onPause();else onResume();});

  var a=hm(wmT()),b=hm(weT());NATIVE.setWidgetTimes(a[0],a[1],b[0],b[1]);
  var d=today();NATIVE.markAnswered('m',done(d,'m')?d:'');NATIVE.markAnswered('e',done(d,'e')?d:'');

/* ---------- вход: код из 4 цифр и отпечаток ---------- */
function sha256(a){function r(v,n){return(v>>>n)|(v<<(32-n));}var P=Math.pow,mw=P(2,32),res='',w=[],bl=a.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={},i,j,c;
  for(c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pl]=(P(c,.5)*mw)|0;k[pl++]=(P(c,1/3)*mw)|0;}}
  a+='\x80';while(a.length%64-56)a+='\x00';
  for(i=0;i<a.length;i++){j=a.charCodeAt(i);if(j>>8)return '';w[i>>2]|=j<<((3-i)%4)*8;}
  w[w.length]=((bl/mw)|0);w[w.length]=bl;
  for(j=0;j<w.length;){var W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);
    for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a0=h[0],e=h[4],
      t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),
      t2=(r(a0,2)^r(a0,13)^r(a0,22))+((a0&h[1])^(a0&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;}
    for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;}
  for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}}
  return res;}
function pinHash(salt,pin){return sha256('imast:'+salt+':'+pin);}
function pinOk(pin){return !!(S.pin&&S.pin.h&&pinHash(S.pin.s,pin)===S.pin.h);}
function lockActive(){return !!(S.pin&&S.pin.h)||!!(NATIVE&&S.bio);}
var pinState=null;
function lockNow(){locked=true;pinState={mode:'unlock',buf:'',msg:'',tries:0,until:0};modal('lock');if(NATIVE&&S.bio)unlock();}

function pinDigit(dg){var ps=pinState;if(!ps)return;
  if(ps.until&&Date.now()<ps.until){ps.msg='Подождите '+Math.ceil((ps.until-Date.now())/1000)+' с';redrawPin();return;}
  if(ps.buf.length>=4)return;ps.buf+=dg;ps.msg='';redrawPin();
  if(ps.buf.length===4)setTimeout(pinFull,120);}
function pinFull(){var ps=pinState;if(!ps)return;var b=ps.buf;ps.buf='';
  if(ps.mode==='unlock'){if(pinOk(b)){unlockDone();return;}ps.tries++;
    if(ps.tries>=5){ps.until=Date.now()+30000;ps.tries=0;ps.msg='Пять ошибок подряд. Подождите 30 секунд';}else ps.msg='Неверный код';}
  else if(ps.mode==='set1'){ps.first=b;ps.mode='set2';ps.msg='';}
  else if(ps.mode==='set2'){if(b===ps.first){var salt=String(Date.now())+Math.random().toString(36).slice(2);S.pin={s:salt,h:pinHash(salt,b)};save();pinState=null;modal('settings');toast('Код входа включён');return;}
    ps.mode='set1';ps.first='';ps.msg='Коды не совпали. Введите код заново';}
  else if(ps.mode==='verifyOff'){if(pinOk(b)){S.pin=null;save();pinState=null;modal('settings');toast('Код входа выключен');return;}ps.msg='Неверный код';}
  else if(ps.mode==='verifyChange'){if(pinOk(b)){ps.mode='set1';ps.msg='';}else ps.msg='Неверный код';}
  redrawPin();}
function redrawPin(){var el=$('#pinbox');if(el)el.innerHTML=pinInner();else modal(locked?'lock':'pin');}
function pinTitle(){var m=pinState&&pinState.mode;return m==='unlock'?'Введите код':m==='set1'?'Придумайте код из 4 цифр':m==='set2'?'Повторите код':'Введите текущий код';}
function pinInner(){var ps=pinState||{buf:'',msg:''},dots='';for(var i=0;i<4;i++)dots+='<i'+(i<ps.buf.length?' class="on"':'')+'></i>';

  return '<p class="small" style="text-align:center;margin:0">'+pinTitle()+'</p><div class="pin-dots" aria-label="Введено цифр: '+ps.buf.length+' из 4">'+dots+'</div><p class="pin-msg" role="alert">'+esc(ps.msg||'')+'</p><div class="keypad">'+keys+'</div>';}

function daysBetween(a,b){return Math.round((dayNum(parse(b))-dayNum(parse(a))));}

function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function dayNum(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
function wd(d){return (d.getDay()+6)%7+1;} /* 1 = Пн */
var WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function today(){return ymd(new Date());}
function phase(){
  if(S.timeMode==='m') return 'm';
  if(S.timeMode==='e') return 'e';

function mentor(text){
  var t=text.toLowerCase();
  if(/умереть|не хочу жить|суицид|самоубий|покончить|убить себя|навредить себе/.test(t)) return {safe:true,text:SAFE};
  if(/тревог|страх|боюсь|волну|беспоко|пережив/.test(t)) return {text:MC.anx};
  if(/злюсь|злос|гнев|раздраж|обид|ссор/.test(t)) return {text:MC.anger};
  if(/устал|лень|лени|не хочу|прокраст|вставать/.test(t)) return {text:MC.tired};
  if(/работ|дело|проект|учёб|учеб|задач|сдать|код/.test(t)) return {text:MC.work};
  return {text:MC.def};
}

   '<line x1="10" x2="290" y1="'+g+'" y2="'+g+'" style="stroke:var(--line)" stroke-width="2"/>'+person+
   '<rect x="'+(tx-tw/2)+'" y="'+(top+cr)+'" width="'+tw+'" height="'+Math.max(H-cr,1)+'" rx="2" fill="#8A6A3A"/>'+
   '<circle cx="'+tx+'" cy="'+cy+'" r="'+cr+'" fill="#4E8A5C"/><circle cx="'+(tx-cr*0.6)+'" cy="'+(cy+cr*0.35)+'" r="'+(cr*0.62)+'" fill="#5FA06D"/><circle cx="'+(tx+cr*0.6)+'" cy="'+(cy+cr*0.35)+'" r="'+(cr*0.62)+'" fill="#3F7A4D"/>'+
   '</svg>';

var CW={c:[156,66],b:[140,66],s:[150,78]},GAP=18,PAD=44;
function rectsOverlap(a,b){return Math.abs(a.x-b.x)*2<(a.w+b.w+8)&&Math.abs(a.y-b.y)*2<(a.h+b.h+8);}
function rayStep(ang,a,b){var c=Math.abs(Math.cos(ang)),s=Math.abs(Math.sin(ang)),x=c>1e-6?(a[0]/2+b[0]/2+GAP)/c:1e9,y=s>1e-6?(a[1]/2+b[1]/2+GAP)/s:1e9;return Math.min(x,y);}
function layoutTask(t){
  var n=Math.max(t.blocks.length,1),R=n>=5?210:170,L;
  for(var tries=0;tries<14;tries++){
    L={c:{x:0,y:0,w:CW.c[0],h:CW.c[1]},b:[]};var all=[L.c];
    t.blocks.forEach(function(b,bi){var ang=-Math.PI/2+bi*2*Math.PI/n,ca=Math.cos(ang),sa=Math.sin(ang);
      var r0=Math.max(R,rayStep(ang,CW.c,CW.b)+20),B={x:ca*r0,y:sa*r0,w:CW.b[0],h:CW.b[1],ang:ang,s:[]};all.push(B);
      var d1=rayStep(ang,CW.b,CW.s)+6,d2=rayStep(ang,CW.s,CW.s)+6,r=r0+d1;
      b.steps.forEach(function(s,si){if(si>0)r+=d2;var S2={x:ca*r,y:sa*r,w:CW.s[0],h:CW.s[1]};B.s.push(S2);all.push(S2);});
      L.b.push(B);});
    var bad=false;for(var i=0;i<all.length&&!bad;i++)for(var j=i+1;j<all.length;j++)if(rectsOverlap(all[i],all[j])){bad=true;break;}
    if(!bad)break;R+=40;}
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  function each(f){f(L.c);L.b.forEach(function(B){f(B);B.s.forEach(f);});}
  each(function(r){minx=Math.min(minx,r.x-r.w/2);miny=Math.min(miny,r.y-r.h/2);maxx=Math.max(maxx,r.x+r.w/2);maxy=Math.max(maxy,r.y+r.h/2);});
  each(function(r){r.x+=PAD-minx;r.y+=PAD-miny;});
  L.W=Math.ceil(maxx-minx+PAD*2);L.H=Math.ceil(maxy-miny+PAD*2);return L;
}
function thread(a,b,on){var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1,sag=Math.min(26,len*.12);
  var cx=mx-dy/len*sag,cy=my+dx/len*sag+sag*.4;
  return '<path d="M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1)+'" fill="none" stroke="'+(on?'#D4AE5A':'#5B6780')+'" stroke-width="'+(on?2.6:1.6)+'"'+(on?'':' stroke-dasharray="5 5"')+'/>';}

function viewStats(){
  var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),first=new Date(y,mo,1),len=new Date(y,mo+1,0).getDate(),off=wd(first)-1,td=today();

    var leaf=S.habits.some(function(h){return h.checks[ds];});if(leaf)dots+='<i class="leaf"></i>';
    cells+='<div class="d'+(ds===td?' today':'')+'"><span>'+k+'</span><span class="dots">'+dots+'</span></div>';
  }

  var passDays={};LEARN.forEach(function(b){var st=S.learn[b.id];if(st&&st.passed&&st.date)passDays[st.date]=(passDays[st.date]||0)+1;});
  for(i2=29;i2>=0;i2--){var dd=ymd(addDays(new Date(),-i2)),v=0;
    if(met==='act')v=(done(dd,'m')?1:0)+(done(dd,'e')?1:0);

  var mx=met==='act'?2:Math.max(1,Math.max.apply(null,vals)),W=300,Hh=110,bw=W/30,plotH=80,bars='';
  vals.forEach(function(v,idx){var hgt=v?Math.max(3,v/mx*plotH):2;bars+='<rect x="'+(idx*bw+2).toFixed(1)+'" y="'+(Hh-8-hgt).toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="2" style="fill:'+(v?'var(--gold)':'var(--line)')+'"><title>'+fmtDate(labels[idx])+': '+v+'</title></rect>';});
  var MET={act:['Активность','Ответы на утренние и вечерние вопросы за 30 дней.','2 раза в день','Сеансов за 30 дней: '+tot],

  fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||typeof d.days!=='object')throw 0;S.habits.forEach(function(x){habitOff(x.id);});S=Object.assign(blank(),d);migrate();S.welcome=false;viewDiary.ed=null;viewTasks.cur=null;save();
    S.habits.forEach(function(x){if(x.notify)habitOn(x);});journalSync();widgetSync();closeModal();render();toast('Данные восстановлены');}catch(err){toast('Это не похоже на копию Imast');}};
  fr.readAsText(e.target.files[0]);});
/* заставка при запуске: знак, затем фраза; нажатие пропускает */
function runSplash(next){var sp=$('#splash');if(!sp){next();return;}sp.hidden=false;var fin=false,tm;
  function end(){if(fin)return;fin=true;clearTimeout(tm);sp.classList.add('hide');setTimeout(function(){sp.hidden=true;next();},450);}
  setTimeout(function(){sp.classList.add('show-phrase');},900);tm=setTimeout(end,3600);
  sp.addEventListener('click',end);}
render();
widgetSync();
var L0=(NATIVE&&NATIVE.takeLaunch)?NATIVE.takeLaunch():'';
if(L0&&!S.welcome)openSess(L0);
var needLock=lockActive()&&!S.welcome;
if(needLock){locked=true;pinState=null;modal('lock');}
runSplash(function(){if(needLock&&locked&&NATIVE&&S.bio)unlock();});
})();
