<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style></head><body>
<title>Imast демо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, five tabs at the bottom, night-sky palette with gold. */
:root{
  --bg:#0E1526; --surface:#162038; --surface2:#1C2947; --line:#2A3756;
  --fg:#EDE8DC; --muted:#9AA5BC; --gold:#D4AE5A; --gold-ink:#F4E4B0; --on-gold:#14203A;
  --ok:#7FB58A; --warn:#E39A8F; --cover:#1B2745; --cover-line:#2A3756;
  --display:'Cormorant Garamond',Georgia,serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F1E8; --surface:#FBF8F1; --surface2:#EFE6D2; --line:#DDD3BE;
    --fg:#1B1F2A; --muted:#5B6173; --gold:#8A6417; --gold-ink:#6B4C10; --on-gold:#FBF8F1;
    --ok:#3F7A4D; --warn:#A8483C; --cover:#E4DAC3; --cover-line:#D3C8AE; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F5F1E8; --surface:#FBF8F1; --surface2:#EFE6D2; --line:#DDD3BE;
  --fg:#1B1F2A; --muted:#5B6173; --gold:#8A6417; --gold-ink:#6B4C10; --on-gold:#FBF8F1;
  --ok:#3F7A4D; --warn:#A8483C; --cover:#E4DAC3; --cover-line:#D3C8AE; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;color:var(--gold-ink);line-height:1}
.brand{flex:none;display:flex;align-items:center;gap:10px}.brand svg{flex:none;width:38px;height:34px;fill:var(--gold)}textarea{resize:vertical;min-height:76px;line-height:1.4}.brand small{display:block;white-space:nowrap;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chips{display:flex;align-items:center;gap:8px}
@media (max-width:380px){.chips{gap:5px}.brand{font-size:26px;gap:7px}.brand svg{width:32px;height:29px}.brand small{font-size:10px;letter-spacing:1.2px}.chips .chip{padding-left:8px;padding-right:8px}}
@media (max-width:340px){.brand small{letter-spacing:.5px;font-size:9px}.brand{font-size:22px}.brand svg{width:28px;height:25px}.chips{gap:4px}.chips .chip{padding-left:6px;padding-right:6px}.icon-btn{min-width:40px}}
.chip{white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:transparent}
.chip.gold{color:var(--gold-ink);border-color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
main{display:flex;flex-direction:column;gap:16px;padding-top:8px}
h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;min-height:46px}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.quote{font-family:var(--display);font-style:italic;font-weight:500;font-size:29px;line-height:1.28;color:var(--fg);text-wrap:balance}
.author{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-ink)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px}
.qmark{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold-ink);background:transparent;font-weight:700;font-size:15px;display:grid;place-items:center;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg.s3 button{font-size:13.5px}
@media (max-width:360px){.seg.s3{gap:2px;padding:3px}.seg.s3 button{font-size:11.5px;padding:10px 1px}}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--gold-ink)}
.stepper{display:flex;justify-content:space-between;align-items:center}
.step{font-size:14px;font-weight:600;color:var(--gold-ink)}
.q-title{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.2}
.field{position:relative}
.field input[type=text],.field textarea,.form input[type=text],#pastet,.form input[type=time],.form input[type=date],.form textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:17px}
.counter{position:absolute;right:12px;bottom:-22px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;gap:10px;font-size:15px}
.ans b{flex:none;width:20px;color:var(--gold-ink);font-weight:600}
.mentor{border-left:3px solid var(--gold);padding-left:14px;display:flex;flex-direction:column;gap:6px}
.mentor .who{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold-ink)}
.mentor.safe{border-left-color:var(--warn)}
.mosaic{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line);background:var(--cover)}
.mosaic svg.portrait{position:absolute;inset:0;width:100%;height:100%;display:block}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(9,1fr)}
.tile{background:var(--cover);outline:1px solid var(--cover-line);outline-offset:-0.5px;transition:opacity .6s}
.tile.open{opacity:0;pointer-events:none}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.caption{font-family:var(--display);font-style:italic;font-size:22px;color:var(--gold-ink)}
.habit{display:flex;flex-direction:column;gap:10px}
.habit-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.habit-name{font-weight:600;font-size:18px}
.dots{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;padding:4px 10px;margin:-6px -8px 0 0;border-radius:10px;min-width:44px;min-height:44px}
.dots:active{background:var(--surface2)}
.hs-sec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.day.on{color:var(--gold-ink);border-color:var(--gold)}
.chipbtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.chipbtn[aria-pressed="true"]{color:var(--on-gold);background:var(--gold);border-color:var(--gold)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:12px;font-weight:600;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:0}
.cal .d.today{border-color:var(--gold);color:var(--fg)}
.cal .d.empty{border:0}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.dots i.leaf{border-radius:2px 7px 2px 7px;background:var(--ok)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:6px}
.legend i.leaf{border-radius:2px 9px 2px 9px;background:var(--ok)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.totals div{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.totals b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.totals span{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--gold-ink)}
.tab[aria-current="page"] svg{stroke:var(--gold)}
.overlay{position:fixed;inset:0;background:rgba(5,8,16,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:28px}
.tree-wrap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px}
.tree-wrap svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
/* заставка */
#splash{position:fixed;inset:0;z-index:50;background:#0E1526;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));text-align:center;transition:opacity .5s}
#splash svg{width:120px;height:108px;fill:#D4AE5A}
#splash .sp-name{font-family:var(--display);font-weight:700;font-size:44px;color:#F4E4B0;line-height:1}
#splash .sp-phrase{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.35;color:#EDE8DC;max-width:420px;opacity:0;transition:opacity .6s}
#splash.show-phrase .sp-phrase{opacity:1}
#splash.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){#splash,#splash .sp-phrase{transition:none}}
/* код входа */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}
.pin-dots i.on{background:var(--gold)}
.pin-msg{min-height:20px;text-align:center;font-size:14px;color:var(--warn)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.keypad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.keypad button.kp-ghost{background:transparent;font-size:15px}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
/* баннер копии */
.banner{display:flex;flex-direction:column;gap:10px;border:1px solid var(--gold);border-radius:14px;padding:14px 16px;background:var(--surface)}
/* обучение */
.blk{display:flex;align-items:center;justify-content:space-between;gap:12px}
.blk .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.blk .bn{font-weight:600;font-size:17px}
.state{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{color:var(--on-gold);background:var(--gold);border-color:var(--gold)}
.lsec{display:flex;flex-direction:column;gap:6px}
.lsec p{font-size:16px;line-height:1.55}
.term{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.term b{font-family:var(--display);font-size:20px;color:var(--gold-ink);font-weight:600}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:15px;min-height:48px}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.opt[disabled]{cursor:default}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--warn)}
/* задачи и доска */
.tasktabs{display:flex;gap:8px;align-items:center}
.tasktabs .scroll{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
.plus{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font-size:26px;line-height:1;display:grid;place-items:center;padding:0}
.board-wrap{position:relative;height:62vh;min-height:360px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#0B1120;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.board{position:relative;transform-origin:0 0}
.board svg.threads{position:absolute;inset:0;overflow:visible}
.bc{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-radius:6px;background:#EDE3CC;color:#1B1F2A;box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:13px;line-height:1.25;text-align:left;border:1px solid #CDBF9F;overflow:hidden}
.bc .ttl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bc .bd{font-size:11px;color:#6B5A3A;flex:none}
.bc.center{background:#F4E4B0;border:2px solid #D4AE5A;font-family:var(--display);font-size:18px;font-weight:700;text-align:center;align-items:center}
.bc.block{background:#E4D6B4;font-weight:700}
.bc.done{border:2px solid #D4AE5A}
.bc.done .ttl::before{content:'✓ ';color:#8A6417;font-weight:700}
.bc.locked{opacity:.45}
.bc.due{box-shadow:0 0 0 2px #E39A8F,0 2px 8px rgba(0,0,0,.45)}
.pin-tack{position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#D4AE5A;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.zoom{position:sticky;left:calc(100% - 52px);top:10px;width:40px;display:flex;flex-direction:column;gap:6px;z-index:3;float:right;margin:10px 10px -96px 0}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.steprow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.steprow:first-child{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gold);background:transparent;color:var(--on-gold);font-weight:700;padding:0;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--gold)}
.chk[disabled]{opacity:.4;cursor:not-allowed}
.edblock{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px}
.edstep{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.edstep .when{display:flex;gap:6px;grid-column:1 / -1}
.edstep input,.edblock input,.form select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;min-width:0}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:10px;width:40px;height:40px;color:var(--muted);font-size:18px;padding:0}
.entry-item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.entry-item:first-of-type{border-top:0}
button.blk[disabled]{opacity:.5;cursor:not-allowed}
button.card{font:inherit;color:inherit;background:var(--surface)}
.fmtname{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold-ink)}
.brand small.pill{display:flex;align-items:center;gap:4px;width:max-content;margin-top:5px;padding:3px 7px 3px 9px;border-radius:99px;background:var(--gold);color:var(--on-gold);font-weight:700;letter-spacing:1.5px}
.brand small.pill .caret{width:9px;height:6px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-btn:active small.pill{filter:brightness(.92)}
/* левое меню */
.menu-btn{flex:none}
.brand-btn{border:0;background:transparent;padding:4px 6px 4px 0;margin:0;color:inherit;text-align:left;cursor:pointer;border-radius:10px;min-width:0}
.brand-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lefthead{display:flex;align-items:center;gap:10px;min-width:0}
.drawer-ov{position:fixed;inset:0;background:rgba(5,8,16,.62);z-index:25;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(304px,86vw);background:var(--surface);border-right:1px solid var(--line);z-index:26;transform:translateX(-104%);transition:transform .24s ease;display:flex;flex-direction:column;gap:2px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
.drawer.open{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dr-head .brand{font-size:26px}
.dr-item{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;border-radius:12px;padding:9px 10px;text-align:left;min-height:54px}
.dr-item svg{flex:none;width:24px;height:24px;stroke:var(--muted)}
.dr-item .t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.dr-item b{font-size:16px;font-weight:600}
.dr-item .t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-item[aria-current="page"]{background:var(--surface2)}
.dr-item[aria-current="page"] svg{stroke:var(--gold)}
.dr-item[aria-current="page"] b{color:var(--gold-ink)}
.dr-sep{height:1px;background:var(--line);margin:6px 8px}

<script>
(function(){
'use strict';
/* ---------- язык: русский или английский ---------- */
var LANG=(function(){try{var q=(location.search.match(/[?&]lang=(ru|en)\b/)||[])[1];if(q)return q;var d=JSON.parse(localStorage.getItem('imast-demo-v1')||'null');if(d&&(d.lang==='ru'||d.lang==='en'))return d.lang;if(d)return 'ru';}catch(e){}
  var n=((navigator.languages&&navigator.languages[0])||navigator.language||'ru').toLowerCase();return /^(ru|uk|be|kk|ky|hy|az|ka|uz|tg|tk)\b/.test(n)?'ru':'en';})();

if(LANG==='en'){document.title='Imast demo';[['[data-act="menu"]','aria-label','Open menu'],['.brand-btn','aria-label','Imast, teaching: Stoicism. Choose a teaching'],['#drawer','aria-label','Menu'],['.dr-head [data-act="mclose"]','aria-label','Close menu']].forEach(function(x){var el=document.querySelector(x[0]);if(el)el.setAttribute(x[1],x[2]);});var cs=document.getElementById('chipSample');if(cs)cs.textContent='Sample';}
document.documentElement.setAttribute('data-theme','dark'); /* демо всегда тёмное, как презентация */
/* ---------- данные: только в этом браузере ---------- */
var KEY='imast-demo-v1', mem=null;
function blank(){return {welcome:true,days:{},habits:[],timeMode:'auto',perm:null,sample:false,learn:{}};}
function load(){
  try{var s=localStorage.getItem(KEY); if(s) return Object.assign(blank(),JSON.parse(s));}catch(e){}
  if(mem){try{return Object.assign(blank(),JSON.parse(mem));}catch(e){}}
  return blank();
}
var S=load();
/* старая «Запись дня» (одна в день) переезжает в список записей */
function migrate(){
  for(var k in S.days){var r=S.days[k];if(!r)continue;
    if(r.entry&&!r.entries)r.entries=[{f:'day',v:{s:r.entry.s||'',a:r.entry.a||'',c:r.entry.c||''},t:0}];
    delete r.entry;}
  if(!S.learn||typeof S.learn!=='object')S.learn={};
}
migrate();
if(!S.lang||/[?&]lang=/.test(location.search)){S.lang=LANG;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
/* ---------- мост к телефону (есть только внутри APK) ---------- */
var NATIVE=window.ImastNative||null, nCbs={}, locked=false;
/* блокировка при возврате в приложение: ext — мы сами открыли другое окно (файл, календарь, отпечаток) */
var ext=false, pausedAt=0, ignoreResumeUntil=0;
function goingOut(){ext=true;}
function onPause(){pausedAt=Date.now();}
function onResume(){
  if(ext){ext=false;pausedAt=0;return;}
  var away=pausedAt?Date.now()-pausedAt:0;pausedAt=0;
  if(Date.now()<ignoreResumeUntil)return;
  if(away>1500&&lockActive()&&!locked&&!S.welcome)lockNow();
}
window.ImastNativeCallback=function(t,v){if(t==='launch'){openSess(v);return;}if(t==='resume'){widgetSync();onResume();if(typeof route==='function'&&route()==='train'&&!$('#modal').firstChild)render();return;}if(t==='pause'){onPause();return;}var f=nCbs[t];if(f){delete nCbs[t];f(v);}};
if(!NATIVE)document.addEventListener('visibilitychange',function(){if(document.hidden)onPause();else onResume();});
function toMin(t){var x=hm(t);return x[0]*60+x[1];}
function wmT(){return S.wm||'08:00';}
function weT(){return S.we||'20:30';}
function widgetSync(){if(!NATIVE||!NATIVE.setWidgetData)return;try{
  if(NATIVE.setLang)NATIVE.setLang(LANG);
  NATIVE.setWidgetData(JSON.stringify(Q.map(function(q){return {t:q.t,a:q.a,n:q.n};})),QS.m[0],QS.e[0]);
  var a=hm(wmT()),b=hm(weT());NATIVE.setWidgetTimes(a[0],a[1],b[0],b[1]);
  var d=today();NATIVE.markAnswered('m',done(d,'m')?d:'');NATIVE.markAnswered('e',done(d,'e')?d:'');
  var v=JSON.parse(NATIVE.getWidgetVotes()||'{}');S.votes=v;save();}catch(e){}}
function openSess(s){if(s!=='m'&&s!=='e')return;wiz={sess:s,i:0,ans:[]};closeModal();go('diary');}
function nPerm(name,fn){if(!NATIVE){fn(true);return;}if(NATIVE.hasPermission(name)){fn(true);return;}nCbs['permission:'+name]=fn;NATIVE.requestPermission(name);}
function hm(t){var p=(t||'08:00').split(':');return [+p[0]||0,+p[1]||0];}
function habitOn(h){if(!NATIVE||!h.time)return;var t=hm(h.time);NATIVE.setReminder(h.id,'Imast · '+h.name,T_('Время для привычки'),t[0],t[1],h.days.join(','));}
function habitOff(id){if(NATIVE)NATIVE.cancelReminder(id);}
function journalSync(){if(!NATIVE)return;if(S.jr){var a=hm(wmT()),b=hm(weT());NATIVE.setReminder('journal-m',T_('Imast · утро'),T_('Три вопроса на день ждут вас'),a[0],a[1],'');NATIVE.setReminder('journal-e',T_('Imast · вечер'),T_('Подведите итоги дня'),b[0],b[1],'');}else{NATIVE.cancelReminder('journal-m');NATIVE.cancelReminder('journal-e');}}
/* ---------- вход: код из 4 цифр и отпечаток ---------- */
function sha256(a){function r(v,n){return(v>>>n)|(v<<(32-n));}var P=Math.pow,mw=P(2,32),res='',w=[],bl=a.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={},i,j,c;
  for(c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pl]=(P(c,.5)*mw)|0;k[pl++]=(P(c,1/3)*mw)|0;}}
  a+='\x80';while(a.length%64-56)a+='\x00';
  for(i=0;i<a.length;i++){j=a.charCodeAt(i);if(j>>8)return '';w[i>>2]|=j<<((3-i)%4)*8;}
  w[w.length]=((bl/mw)|0);w[w.length]=bl;
  for(j=0;j<w.length;){var W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);
    for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a0=h[0],e=h[4],
      t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),
      t2=(r(a0,2)^r(a0,13)^r(a0,22))+((a0&h[1])^(a0&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;}
    for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;}
  for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}}
  return res;}
function pinHash(salt,pin){return sha256('imast:'+salt+':'+pin);}
function pinOk(pin){return !!(S.pin&&S.pin.h&&pinHash(S.pin.s,pin)===S.pin.h);}
function lockActive(){return !!(S.pin&&S.pin.h)||!!(NATIVE&&S.bio);}
var pinState=null;
function lockNow(){locked=true;pinState={mode:'unlock',buf:'',msg:'',tries:0,until:0};modal('lock');if(NATIVE&&S.bio)unlock();}
function unlockDone(){locked=false;pinState=null;closeModal();render();}
function unlock(){goingOut();NATIVE.authenticate(T_('Вход в Imast'));nCbs.auth=function(v){ext=false;ignoreResumeUntil=Date.now()+1500;
  if(v===true){unlockDone();}
  else if(v==='unavailable'){S.bio=false;save();if(S.pin&&S.pin.h){toast(T_('Отпечаток недоступен, войдите по коду'));modal('lock');}else{unlockDone();toast(T_('Отпечаток недоступен, вход по нему выключен'));}}};}
function pinDigit(dg){var ps=pinState;if(!ps)return;
  if(ps.until&&Date.now()<ps.until){ps.msg=T_('Подождите ')+Math.ceil((ps.until-Date.now())/1000)+T_(' с');redrawPin();return;}
  if(ps.buf.length>=4)return;ps.buf+=dg;ps.msg='';redrawPin();
  if(ps.buf.length===4)setTimeout(pinFull,120);}
function pinFull(){var ps=pinState;if(!ps)return;var b=ps.buf;ps.buf='';

var CW={c:[156,66],b:[140,66],s:[150,78]},GAP=18,PAD=44;
function rectsOverlap(a,b){return Math.abs(a.x-b.x)*2<(a.w+b.w+8)&&Math.abs(a.y-b.y)*2<(a.h+b.h+8);}
function rayStep(ang,a,b){var c=Math.abs(Math.cos(ang)),s=Math.abs(Math.sin(ang)),x=c>1e-6?(a[0]/2+b[0]/2+GAP)/c:1e9,y=s>1e-6?(a[1]/2+b[1]/2+GAP)/s:1e9;return Math.min(x,y);}
function layoutTask(t){
  var n=Math.max(t.blocks.length,1),R=n>=5?210:170,L;
  for(var tries=0;tries<14;tries++){
    L={c:{x:0,y:0,w:CW.c[0],h:CW.c[1]},b:[]};var all=[L.c];
    t.blocks.forEach(function(b,bi){var ang=-Math.PI/2+bi*2*Math.PI/n,ca=Math.cos(ang),sa=Math.sin(ang);
      var r0=Math.max(R,rayStep(ang,CW.c,CW.b)+20),B={x:ca*r0,y:sa*r0,w:CW.b[0],h:CW.b[1],ang:ang,s:[]};all.push(B);
      var d1=rayStep(ang,CW.b,CW.s)+6,d2=rayStep(ang,CW.s,CW.s)+6,r=r0+d1;
      b.steps.forEach(function(s,si){if(si>0)r+=d2;var S2={x:ca*r,y:sa*r,w:CW.s[0],h:CW.s[1]};B.s.push(S2);all.push(S2);});
      L.b.push(B);});
    var bad=false;for(var i=0;i<all.length&&!bad;i++)for(var j=i+1;j<all.length;j++)if(rectsOverlap(all[i],all[j])){bad=true;break;}
    if(!bad)break;R+=40;}
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  function each(f){f(L.c);L.b.forEach(function(B){f(B);B.s.forEach(f);});}
  each(function(r){minx=Math.min(minx,r.x-r.w/2);miny=Math.min(miny,r.y-r.h/2);maxx=Math.max(maxx,r.x+r.w/2);maxy=Math.max(maxy,r.y+r.h/2);});
  each(function(r){r.x+=PAD-minx;r.y+=PAD-miny;});
  L.W=Math.ceil(maxx-minx+PAD*2);L.H=Math.ceil(maxy-miny+PAD*2);return L;
}
function thread(a,b,on){var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1,sag=Math.min(26,len*.12);

function abOf(){if(!Array.isArray(S.abst))S.abst=[];return S.abst;}
function abById(id){return abOf().filter(function(x){return x.id===id;})[0];}
function abKind(a){return AK[a.kind]||AK.other;}
function abName(a){return a.kind==='other'||!AK[a.kind]?(a.nm||''):AK[a.kind].nm;}
function abOkDays(a){var m=a.marks||{};return Object.keys(m).filter(function(k){return m[k]==='ok';}).sort();}
function abStreak(a){var m=a.marks||{},td=today(),d=m[td]==='ok'?td:ymd(addDays(parse(td),-1)),n=0;while(m[d]==='ok'){n++;d=ymd(addDays(parse(d),-1));}return n;}
function abBest(a){var best=0,run=0,prev=null;abOkDays(a).forEach(function(d){run=(prev&&daysBetween(prev,d)===1)?run+1:1;prev=d;if(run>best)best=run;});return best;}
function abMoney(v,cur){var n=Math.round(v).toLocaleString(LOC);return LANG==='en'&&(cur==='$'||cur==='€')?cur+n:n+' '+(cur||'');}
function abSave(a,n){var k=abKind(a),per=+a.per||0;if(!n||!per)return '';
  if(k.mode==='count'){var cnt=Math.round(n*per*10)/10,s=esc(k.verb)+'<b>'+fmt(cnt)+' '+(cnt%1?k.u[1]:plural(cnt,k.u[0],k.u[1],k.u[2]))+'</b>';
    if(k.pack>1){var pk=Math.round(cnt/k.pack*10)/10;s+=T_(': это ')+'<b>'+fmt(pk)+' '+(LANG==='en'?(pk===1?'pack':'packs'):(pk%1?T_('пачки'):plural(pk,T_('пачка'),T_('пачки'),T_('пачек'))))+'</b>';}
    if(+a.price){s+=(k.pack>1?T_(' и '):T_(': это '))+'<b>'+abMoney(cnt/k.pack*a.price,a.cur)+'</b>';}
    return s+'.';}
  if(k.mode==='hours'){var hrs=Math.round(n*per*10)/10;return T_('Вы вернули себе ')+'<b>'+fmt(hrs)+' '+(LANG==='en'?(hrs===1?'hour':'hours'):(hrs%1?T_('часа'):plural(hrs,T_('час'),T_('часа'),T_('часов'))))+'</b>.';}
  return T_('Сэкономлено ')+'<b>'+abMoney(n*per,a.cur)+'</b>.';}
function abHealth(a,st){var nx=null,got=0,li='';
  WHO.forEach(function(w){var ok=st>=w[0];if(ok)got++;else if(!nx)nx=w;li+='<li class="'+(ok?'got':'')+'"><b>'+w[1]+'</b>: '+w[2]+'</li>';});
  var left=nx?nx[0]-st:0;
  return '<details class="ab-ms"><summary>'+T_('Здоровье: ')+got+T_(' из ')+WHO.length+(nx?T_(' · следующее через ')+left+' '+plural(left,T_('день'),T_('дня'),T_('дней')):'')+'</summary><ul>'+li+'</ul>'+
    '<p class="muted small">'+T_('Общие данные ВОЗ о пользе отказа от курения, а не прогноз лично для вас. Отсчёт идёт от последнего срыва.')+'</p></details>';}
function abCal(a){var off=viewAbst.mo[a.id]||0,now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+off,1),y=first.getFullYear(),mo=first.getMonth(),len=new Date(y,mo+1,0).getDate(),td=today(),m=a.marks||{};
  var cells='';WD.forEach(function(n){cells+='<div class="dow">'+n+'</div>';});
  for(var i=0;i<wd(first)-1;i++)cells+='<div class="d empty"></div>';
  for(var k=1;k<=len;k++){var ds=y+'-'+pad(mo+1)+'-'+pad(k),st=m[ds];
    if(ds>td||ds<a.start){cells+='<div class="d out"><span>'+k+'</span></div>';continue;}
    var lab=fmtDate(ds)+': '+(st==='ok'?T_('без срыва'):st==='slip'?T_('срыв'):T_('не отмечен'));
    cells+='<button class="d'+(st==='ok'?' ok':st==='slip'?' slip':' open')+(ds===td?' today':'')+'" data-act="abday" data-id="'+a.id+'" data-v="'+ds+'" aria-label="'+esc(lab)+'"><span>'+k+'</span><span class="abm">'+(st==='ok'?'<i></i>':st==='slip'?'<i class="slip"></i>':'')+'</span></button>';}
  var startMo=a.start.slice(0,7),curMo=y+'-'+pad(mo+1);
  return '<div class="ab-nav"><button data-act="abmo" data-id="'+a.id+'" data-v="-1" aria-label="'+T_('Предыдущий месяц')+'"'+(curMo<=startMo?' disabled':'')+'>‹</button><b>'+MONTHS[mo].charAt(0).toUpperCase()+MONTHS[mo].slice(1)+' '+y+'</b><button data-act="abmo" data-id="'+a.id+'" data-v="1" aria-label="'+T_('Следующий месяц')+'"'+(off>=0?' disabled':'')+'>›</button></div>'+
    '<div class="cal">'+cells+'</div><div class="legend"><span><i class="leaf"></i>'+T_('без срыва')+'</span><span><i class="slip"></i>'+T_('срыв')+'</span><span>'+T_('нажмите на день, чтобы изменить')+'</span></div>';}
function abCard(a){var td=today(),k=abKind(a),nm=esc(abName(a)),st=abStreak(a),okd=abOkDays(a),mk=(a.marks||{})[td],sv=abSave(a,okd.length),t='';
  if(td<a.start)t='<p class="muted small">'+T_('Отсчёт начнётся ')+esc(fmtDate(a.start))+'</p>';
  else if(mk==='ok')t='<div class="head-row"><p class="ab-done">✓ '+T_('Сегодня без ')+nm+'</p><button class="btn ghost" data-act="abundo" data-id="'+a.id+'">'+T_('Отменить')+'</button></div>';
  else if(mk==='slip')t='<p class="small">'+T_('Сегодня был срыв. Серия начнётся заново, а всё сэкономленное останется с вами.')+'</p><button class="btn ghost" data-act="abundo" data-id="'+a.id+'">'+T_('Отменить отметку')+'</button>';
  else t='<div class="ab-today"><button class="btn primary" data-act="abok" data-id="'+a.id+'">'+T_('Сегодня без ')+nm+'</button><button class="btn" data-act="abslip" data-id="'+a.id+'">'+T_('Был срыв')+'</button></div>';
  var men=st>=30?T_('Тридцать дней позади. Эпиктет писал, что так привычка сначала слабеет, а потом исчезает совсем. Не подбрасывайте дров в огонь.'):
    T_('Считайте дни, когда удержались. Продержитесь тридцать подряд, и привычка начнёт слабеть.')+' '+T_('До тридцати дней осталось: ')+(30-st)+'.';
  var warn=a.kind==='alcohol'?T_('Пили много и каждый день? Резко бросать опасно: сначала поговорите с врачом.'):a.kind==='bets'?T_('Если ставки уже бьют по деньгам или близким, поговорите со специалистом или найдите группу «Анонимные игроки».'):'';
  return '<div class="card"><div class="habit-head"><div><div class="habit-name">'+T_('Дни без ')+nm+'</div><div class="muted small">'+T_('с ')+esc(fmtDate(a.start))+(a.urges?T_(' · устояли перед тягой: ')+a.urges:'')+'</div></div>'+

    '<div class="totals"><div><b>'+st+'</b><span>'+T_('дней подряд')+'</span></div><div><b>'+okd.length+'</b><span>'+T_('всего дней без')+'</span></div><div><b>'+abBest(a)+'</b><span>'+T_('рекорд')+'</span></div></div>'+
    (sv?'<p class="ab-save">'+sv+'</p>':'')+t+
    '<button class="btn" data-act="aburge" data-id="'+a.id+'">'+T_('Тянет')+'</button>'+
    abCal(a)+(a.kind==='smoke'?abHealth(a,st):'')+
    '<div class="mentor"><span class="who">'+T_('Эпиктет, «Беседы» II.18, пересказ')+'</span><p>'+men+'</p></div>'+
    (warn?'<p class="muted small">'+warn+'</p>':'')+'</div>';}

function practiced(k){return done(k,'m')||done(k,'e')||entriesOf(S.days[k]).length>0;}
function autoEvents(){var out=[],keys=Object.keys(S.days||{}).sort();
  function add(d,t,n){if(d)out.push({d:d,t:t,n:n||'',auto:true});}
  var fm=null,fe=null,fj=null;
  keys.forEach(function(k){if(!fm&&done(k,'m'))fm=k;if(!fe&&done(k,'e'))fe=k;if(!fj&&entriesOf(S.days[k]).length)fj=k;});
  add(fm,T_('Первые ответы утром'),T_('Начало практики'));add(fe,T_('Первый разбор вечера'));add(fj,T_('Первая запись в дневнике'));
  var run=0,prev=null,h7=false,h30=false,tiles=0,hm=false;
  keys.forEach(function(k){if(!practiced(k))return;run=(prev&&daysBetween(prev,k)===1)?run+1:1;prev=k;
    if(run===7&&!h7){h7=true;add(k,T_('7 дней практики подряд'));}
    if(run===30&&!h30){h30=true;add(k,T_('30 дней практики подряд'));}
    tiles+=(done(k,'m')?1:0)+(done(k,'e')?1:0)+(entriesOf(S.days[k]).length?1:0);
    if(!hm&&tiles>=90){hm=true;add(k,T_('Мозаика собрана'));}});
  (S.habits||[]).forEach(function(h){var c=Object.keys(h.checks||{}).filter(function(x){return h.checks[x];}).sort()[0];if(c)add(c,T_('Первая отметка привычки ')+QO+h.name+QC);});
  LEARN.forEach(function(b){var st=S.learn&&S.learn[b.id];if(st&&st.passed&&st.date)add(st.date,T_('Сдан урок ')+QO+b.title+QC);});
  (S.tasks||[]).forEach(function(t){var ok=true,last='',n=0;(t.blocks||[]).forEach(function(b){(b.steps||[]).forEach(function(s){n++;if(!s.done)ok=false;else if((s.doneDate||'')>last)last=s.doneDate||'';});});
    if(ok&&n&&last)add(last,T_('Выполнена задача ')+QO+t.title+QC);});
  var lg=fitOf().log.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
  if(lg.length){var pg=progOf(lg[0].p);add(lg[0].d,T_('Первая тренировка'),pg?pg.name:'');}
  if(lg.length>=10)add(lg[9].d,T_('10 тренировок'));
  abOf().forEach(function(a){var nmx=abName(a),run=0,prev=null,hit={},cum=0,ph={};add(a.start,T_('Начат отсчёт: дни без ')+nmx,a.why||'');
    Object.keys(a.marks||{}).sort().forEach(function(d){if(a.marks[d]!=='ok'){run=0;prev=null;return;}run=(prev&&daysBetween(prev,d)===1)?run+1:1;prev=d;cum++;
      [7,30,100,365].forEach(function(n){if(run===n&&!hit[n]){hit[n]=1;add(d,n+' '+plural(n,T_('день'),T_('дня'),T_('дней'))+T_(' без ')+nmx,n===30?T_('Эпиктет советовал продержаться тридцать дней'):'');}});
      if(a.kind==='smoke'&&+a.per){[10,100].forEach(function(n){if(cum*a.per/20>=n&&!ph[n]){ph[n]=1;add(d,T_('Не выкурено ')+n+T_(' пачек'));}});}});});
  return out;}

/* ---------- прогресс: график как у акций ---------- */
function inPause(ds){return (S.pauses||[]).some(function(p){return ds>=p.from&&(!p.to||ds<=p.to);});}
function pauseNow(){var ps=S.pauses||[];return ps.length&&!ps[ps.length-1].to?ps[ps.length-1]:null;}
/* +1 за действие, −0,5 за пропущенную запланированную привычку или шаг, не больше −2 за день */
function scoreIndex(){
  var td=today(),idx={};
  function A(ds,k,n){var x=idx[ds]||(idx[ds]={plus:0,miss:0});x[k]+=n||1;}
  for(var k in S.days){var r=S.days[k];if(!r)continue;if(done(k,'m'))A(k,'plus');if(done(k,'e'))A(k,'plus');var en=entriesOf(r).length;if(en)A(k,'plus',Math.min(en,3));}
  S.habits.forEach(function(h){for(var c in h.checks)if(h.checks[c])A(c,'plus');});
  (S.tasks||[]).forEach(function(t){t.blocks.forEach(function(b){b.steps.forEach(function(s){
    if(s.done&&s.doneDate)A(s.doneDate,'plus');
    if(!t.sample&&s.date&&s.date<td&&!(s.done&&s.doneDate&&s.doneDate<=s.date))A(s.date,'miss');});});});
  LEARN.forEach(function(b){var st=S.learn[b.id];if(st&&st.passed&&st.date)A(st.date,'plus');});
  var f=fitOf();f.log.forEach(function(l){A(l.d,'plus');});
  abOf().forEach(function(a){for(var ad in (a.marks||{}))if(a.marks[ad]==='ok')A(ad,'plus');});
  for(var sd in f.steps)if(f.steps[sd]>=f.goal)A(sd,'plus');
  return idx;}
function habitMisses(ds){var n=0,w=wd(parse(ds));S.habits.forEach(function(h){if(!h.checks[ds]&&ds>=h.start&&h.days.indexOf(w)>=0)n++;});return n;}
function daySeries(){
  var td=today(),idx=scoreIndex(),keys=Object.keys(idx).filter(function(k){return idx[k].plus>0;}).sort();
  var start=keys.length?keys[0]:td,lim=ymd(addDays(new Date(),-400));if(start<lim)start=lim;
  var out=[],val=0,d=parse(start),end=parse(td);
  while(d<=end){var ds=ymd(d);d=addDays(d,1);if(inPause(ds))continue;
    var x=idx[ds]||{plus:0,miss:0},miss=x.miss+(ds<td?habitMisses(ds):0),minus=Math.min(miss*0.5,2);
    var o=val,c=Math.max(0,o+x.plus-minus);
    out.push({d:ds,o:o,c:c,h:Math.max(o,o+x.plus,c),l:Math.max(0,Math.min(o,o-minus,c)),plus:x.plus,miss:miss,minus:minus,n:1});val=c;}
  return out;}
function groupSeries(s,tf){if(tf==='d')return s;var out=[],cur=null;
  s.forEach(function(x){var dt=parse(x.d),key=tf==='w'?ymd(addDays(dt,1-wd(dt))):x.d.slice(0,7);
    if(!cur||cur.key!==key){cur={key:key,d:x.d,o:x.o,c:x.c,h:x.h,l:x.l,plus:0,miss:0,minus:0,n:0};out.push(cur);}
    cur.c=x.c;cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.plus+=x.plus;cur.miss+=x.miss;cur.minus+=x.minus;cur.n++;cur.end=x.d;});
  return out;}
function num(v){return fmt(v);}
function candleLabel(x,tf){if(tf==='d')return fmtDate(x.d);if(tf==='w')return T_('неделя с ')+fmtDate(x.key);var p=x.key.split('-');return MONTHS[+p[1]-1]+' '+p[0];}
function candleChart(s,tf,pick){
  var N={d:30,w:26,m:12}[tf],vis=s.slice(-N),W=330,H=190,top=14,bot=22,R=38,pw=W-R,ph=H-top-bot;
  if(!vis.length)return '';
  var rec=0;s.forEach(function(x){rec=Math.max(rec,x.c);});
  var lo=Infinity,hi=-Infinity;vis.forEach(function(x){lo=Math.min(lo,x.l);hi=Math.max(hi,x.h);});hi=Math.max(hi,rec);
  if(hi-lo<4){hi=lo+4;}var padv=(hi-lo)*0.08;lo=Math.max(0,lo-padv);hi=hi+padv;
  function Y(v){return top+(hi-v)/(hi-lo)*ph;}
  var slot=pw/N,cw=Math.max(3,Math.min(14,slot*0.62)),x0=pw-vis.length*slot,g='';
  for(var gi=0;gi<=3;gi++){var gv=lo+(hi-lo)*gi/3,gy=Y(gv);g+='<line x1="0" x2="'+pw+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(pw+6)+'" y="'+(gy+3.5).toFixed(1)+'" font-size="10" style="fill:var(--muted)">'+num(Math.round(gv*2)/2)+'</text>';}
  var ry=Y(rec);g+='<line x1="0" x2="'+pw+'" y1="'+ry.toFixed(1)+'" y2="'+ry.toFixed(1)+'" style="stroke:var(--gold)" stroke-dasharray="4 4" stroke-width="1"/><text x="4" y="'+(ry-4).toFixed(1)+T_('" font-size="10" style="fill:var(--gold-ink)">рекорд ')+num(rec)+'</text>';
  var MA={d:7,w:4,m:3}[tf],full=s.slice(-(N+MA)),off=full.length-vis.length,pts=[];
  vis.forEach(function(x,i){var j=i+off,a=Math.max(0,j-MA+1),sum=0,cnt=0;for(var q=a;q<=j;q++){sum+=full[q].c;cnt++;}pts.push((x0+i*slot+slot/2).toFixed(1)+','+Y(sum/cnt).toFixed(1));});
  var cs='';vis.forEach(function(x,i){var cx=x0+i*slot+slot/2,up=x.c>x.o,down=x.c<x.o,col=up?'var(--ok)':down?'var(--warn)':'var(--muted)';
    var yt=Y(Math.max(x.o,x.c)),yb=Y(Math.min(x.o,x.c)),bh=Math.max(1.6,yb-yt),gi2=s.length-vis.length+i;
    cs+='<g'+(pick===gi2?' opacity="1"':'')+'><line x1="'+cx.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y1="'+Y(x.h).toFixed(1)+'" y2="'+Y(x.l).toFixed(1)+'" style="stroke:'+col+'" stroke-width="1.4"/>'+
      '<rect x="'+(cx-cw/2).toFixed(1)+'" y="'+yt.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" style="fill:'+col+'"/>'+
      (pick===gi2?'<rect x="'+(cx-slot/2+0.5).toFixed(1)+'" y="'+top+'" width="'+(slot-1).toFixed(1)+'" height="'+ph+'" rx="3" style="fill:var(--gold)" fill-opacity=".12"/>':'')+
      '<rect x="'+(cx-slot/2).toFixed(1)+'" y="0" width="'+slot.toFixed(1)+'" height="'+H+'" fill="transparent" data-act="cpick" data-v="'+gi2+'"><title>'+esc(candleLabel(x,tf))+'</title></rect></g>';});
  var lab='<text x="'+(x0+slot/2).toFixed(1)+'" y="'+(H-6)+'" font-size="10" style="fill:var(--muted)">'+esc(candleLabel(vis[0],tf))+'</text><text x="'+pw+'" y="'+(H-6)+'" font-size="10" text-anchor="end" style="fill:var(--muted)">'+(tf==='d'?T_('сегодня'):tf==='w'?T_('эта неделя'):T_('этот месяц'))+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+T_('" role="img" aria-label="График прогресса: ')+vis.length+T_(' свечей, сейчас ')+num(s[s.length-1].c)+T_(' пунктов, рекорд ')+num(rec)+'">'+g+
   (pts.length>1?'<polyline points="'+pts.join(' ')+'" fill="none" style="stroke:var(--gold)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>':'')+cs+lab+'</svg>';}
function chgHTML(dv,label){var cls=dv>0?'up':dv<0?'down':'flat',sg=dv>0?'▲ +':dv<0?'▼ −':'■ ';return '<span class="chg '+cls+'">'+sg+num(Math.abs(dv))+' '+label+'</span>';}

document.addEventListener('input',function(e){

/* восстановление из копии: файл или вставленный текст */
function restoreText(txt){try{txt=String(txt||'');var a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<=a)throw 0;
    var d=JSON.parse(txt.slice(a,b+1));if(!d||typeof d.days!=='object')throw 0;S.habits.forEach(function(x){habitOff(x.id);});S=Object.assign(blank(),d);migrate();S.welcome=false;viewDiary.ed=null;viewTasks.cur=null;save();
    S.habits.forEach(function(x){if(x.notify)habitOn(x);});journalSync();widgetSync();closeModal();render();toast(T_('Данные восстановлены'));return true;}catch(err){toast(T_('Это не похоже на копию Imast: вставьте текст целиком'));return false;}}
document.addEventListener('change',function(e){if(!e.target||e.target.id!=='importf'||!e.target.files[0])return;var fr=new FileReader();
  fr.onload=function(){restoreText(fr.result);};
  fr.readAsText(e.target.files[0]);});
/* заставка при запуске: знак, затем фраза; нажатие пропускает */
var SPLASH_PHRASES=[T_('Imast не будет думать за вас.'),T_('Imast — не лекарство от болезней.'),T_('Imast — карта троп, оставленных великими мыслителями.')];
var curPhrase=null;
function splashPhrase(){if(curPhrase)return curPhrase;var i=0;try{i=(parseInt(localStorage.getItem('imast-splash'),10)||0)%SPLASH_PHRASES.length;localStorage.setItem('imast-splash',String((i+1)%SPLASH_PHRASES.length));}catch(e){}return curPhrase=SPLASH_PHRASES[i];}
function runSplash(next){var sp=$('#splash');if(!sp){next();return;}sp.hidden=false;var fin=false,tm;var spp=$('#spPhrase');if(spp)spp.textContent=splashPhrase();
  function end(){if(fin)return;fin=true;clearTimeout(tm);sp.classList.add('hide');setTimeout(function(){sp.hidden=true;next();},450);}
  setTimeout(function(){sp.classList.add('show-phrase');},900);tm=setTimeout(end,3600);
  sp.addEventListener('click',end);}
render();

runSplash(function(){if(needLock&&locked&&NATIVE&&S.bio)unlock();});
})();
