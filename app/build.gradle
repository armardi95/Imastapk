plugins {
    id 'com.android.application'
}

android {
    namespace 'app.imast'
    compileSdk 34

    defaultConfig {
        applicationId 'app.imast.demo'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '1.11'
    }

    // Постоянный ключ тестовых сборок: новый APK ставится поверх старого и данные сохраняются.
    // Для Google Play будет отдельный секретный ключ, он в репозиторий не попадёт.
    signingConfigs {
        debug {
            storeFile file('imast-debug.jks')
            storePassword 'android'
            keyAlias 'imast'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
