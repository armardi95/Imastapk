plugins {
    id 'com.android.application'
}

android {
    namespace 'app.imast'
    compileSdk 34

    defaultConfig {
        applicationId 'app.imast.demo'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
